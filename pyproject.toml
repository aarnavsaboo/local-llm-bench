[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-bench"
version = "0.1.0"
description = "Local language-model benchmark harness"
requires-python = ">=3.10"

[project.scripts]
local-llm-bench = "local_llm_bench.__main__:main"

[tool.setuptools.packages.find]
include = ["local_llm_bench*"]
